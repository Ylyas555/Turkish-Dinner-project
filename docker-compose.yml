version: "3.8"

services:
  php:
    image: php:8.2-apache
    container_name: turkish_php
    volumes:
      - ./Turkish-Dinner-project:/var/www/html
    ports:
      - "8000:80"
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    container_name: turkish_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ymdatabase
    ports:
      - "3306:3306"
    volumes:
      - ./Turkish-Dinner-project/scripts:/docker-entrypoint-initdb.d

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: turkish_phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8081:80"
    depends_on:
      - mysql
